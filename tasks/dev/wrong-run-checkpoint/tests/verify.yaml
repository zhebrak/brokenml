deadline_s: 300
store: true
corpus:
  train: 16384
  val: 512
  length: 65
policy:
  contract:
    fixed:
    - model
    - steps
    - seed
    - train_seqs
    - val_seqs
    - data
    - export
    - ckpt_dir
    - lr
    - warmup_steps
    bounds:
      eval_every:
        min: 1
        max: 100
      pg_timeout_s:
        min: 1
        max: 300
      ckpt_every:
        min: 1
        max: 100
    products:
    - keys:
      - micro_batch
      - grad_accum
      equals: 16
loss_max: 1.55
calibration: c-wrong-run-checkpoint
require_val_every: 100
require_checkpoints_every: 100
placement:
  nodes: 2
  ranks_per_node: 2
throughput:
  ratio_min: 0.5
