deadline_s: 240
corpus:
  train: 16384
  val: 512
  length: 65
data:
  remap:
    rows: 4096
    blocks: 8
policy:
  contract:
    fixed:
    - model
    - steps
    - seed
    - train_seqs
    - val_seqs
    - data
    - export
    - resume_from
    - ckpt_dir
    - lr
    - warmup_steps
    bounds:
      eval_every:
        min: 1
        max: 100
      pg_timeout_s:
        min: 1
        max: 300
    products:
    - keys:
      - micro_batch
      - grad_accum
      equals: 16
loss_max: 1.545
require_val_every: 100
placement:
  nodes: 2
  ranks_per_node: 2
