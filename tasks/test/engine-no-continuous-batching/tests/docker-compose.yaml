services:
  main:
    volumes:
    - ops:/ops
    - shared:/shared
    networks:
    - cluster
  engine:
    image: bench/serve:dev
    pull_policy: never
    hostname: engine
    volumes:
    - ops:/ops:ro
    - shared:/shared
    cpus: 2
    mem_limit: 1500m
    memswap_limit: 1500m
    healthcheck:
      disable: true
    networks:
    - cluster
volumes:
  ops: {}
  shared: {}
networks:
  cluster:
    internal: true
