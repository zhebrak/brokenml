deadline_s: 300
corpus:
  train: 2048
  val: 64
  length: 65
policy:
  contract:
    fixed:
    - model
    - steps
    - seed
    - train_seqs
    - val_seqs
    - data
    - export
    - resume_from
    - ckpt_dir
    - lr
    - warmup_steps
    bounds:
      eval_every:
        min: 1
        max: 10
      pg_timeout_s:
        min: 1
        max: 300
    products:
    - keys:
      - micro_batch
      - grad_accum
      equals: 4
loss_max: 3.45
calibration: o-replication
require_val_every: 10
require_eval_exports_every: 10
placement:
  nodes: 2
  ranks_per_node: 2
