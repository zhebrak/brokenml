# Cluster configuration (owned by the cluster admins; see CONTRACT.md for what jobs may change).
ClusterName=cluster
SlurmctldHost=slurmctld
SlurmUser=slurm
AuthType=auth/munge
PrivateData=jobs,usage
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
TaskProlog=/usr/local/libexec/ocb-taskprolog
HealthCheckProgram=/usr/local/libexec/ocb-healthcheck
HealthCheckInterval=10
HealthCheckNodeState=ANY
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
SchedulerType=sched/backfill
SchedulerParameters=sched_interval=5,bf_interval=5
SlurmdParameters=config_overrides
ReturnToService=2
SlurmctldTimeout=60
SlurmdTimeout=30
MinJobAge=1800
KillWait=10
Waittime=0
MpiDefault=none
StateSaveLocation=/var/lib/slurm
SlurmdSpoolDir=/var/spool/slurm
SlurmctldPidFile=/var/run/slurm/slurmctld.pid
SlurmdPidFile=/var/run/slurm/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
JobCompType=jobcomp/filetxt
JobCompLoc=/shared/slurm/jobcomp.log
AccountingStorageType=accounting_storage/none
JobAcctGatherType=jobacct_gather/none
NodeName=c[1-2] CPUs=2 RealMemory=1500 State=UNKNOWN
PartitionName=main Nodes=c[1-2] Default=YES MaxTime=00:03:00 State=UP
