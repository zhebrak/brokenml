deadline_s: 1500
corpus:
  train: 131072
  val: 512
  length: 65
policy:
  frozen:
  - cluster/slurm.conf
  contract:
    fixed:
    - model
    - steps
    - seed
    - train_seqs
    - val_seqs
    - data
    - export
    - ckpt_dir
    - lr
    - warmup_steps
    bounds:
      eval_every:
        min: 1
        max: 500
      pg_timeout_s:
        min: 1
        max: 300
    products:
    - keys:
      - micro_batch
      - grad_accum
      equals: 16
loss_max: 1.42
calibration: t-time-limit
require_val_every: 500
require_step_coverage: true
placement:
  nodes: 2
  ranks_per_node: 2
