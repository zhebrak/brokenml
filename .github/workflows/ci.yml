# Everything that runs without Docker: lint, format, types, shellcheck, unit tests (including the golden render,
# the trust-zone import boundaries, every patch, the spec schema and the task versions). Docker-backed gates
# (bench sweep, bench qa, bench leak-audit) run on a machine with the images built.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
      - run: uv sync --locked
      - run: make check
  torch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.21"
      - run: uv sync --locked --group torch
      - run: uv run pytest -q -m torch
